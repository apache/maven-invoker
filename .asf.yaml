# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Invoker"
  homepage: https://maven.apache.org/shared/maven-invoker/
  labels:
    - java
    - build-management
    - maven-shared
    - maven
    - hacktoberfest
  protected_branches:
    master: { }
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  autolink_jira:
    - MSHARED
  features:
    issues: true
  pull_requests:
    del_branch_on_merge: true
notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-invoker
project:
  metadata:
    key: maven-invoker
    committee: maven
    name: Apache Maven Invoker
    description: "DEPRECATED: This component is deprecated and replaced by maven-executor (https://github.com/apache/maven-executor). Please migrate to maven-executor for Maven 3.9+ and Maven 4+ support with improved API and features."
    homepage: https://maven.apache.org/shared/maven-invoker/
    download_page: https://maven.apache.org/shared/maven-invoker/download.cgi
    bug_database: https://maven.apache.org/shared/maven-invoker/issue-management.html
    mailing_lists: https://maven.apache.org/shared/maven-invoker/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-invoker
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-invoker
    download_path_suffix: shared
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
